on:
  push:
    branches:
      - main

name: quarto-build

jobs:
  quarto-build:
    runs-on: ubuntu-latest
    name: "Build example"
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2
      - name: Setup R
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
      - name: Install required R packages
        run: |
          sudo apt install libcurl4-openssl-dev
          Rscript -e 'install.packages(c("DT", "ggplot2", "INBOtheme", "knitr", "lipsum", "pak"), repos = c("https://inbo.r-universe.dev", "https://cloud.r-project.org"))'
          Rscript -e 'pak::pkg_install(c("leaflet", "plotly"))'
      - name: Publish to GitHub Pages (and render)
        uses: quarto-dev/quarto-actions/publish@8a96df13519ee81fd526f2dfca5962811136661b # v2
        with:
          target: gh-pages
          path: source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
